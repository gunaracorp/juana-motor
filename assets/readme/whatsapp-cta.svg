<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="wag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25D366"/>
      <stop offset="1" stop-color="#128C7E"/>
    </linearGradient>
  </defs>
  <style>
    .ring { animation: ringPulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .ringB { animation-delay: 1s; }
    @keyframes ringPulse { 0% { transform: scale(.72); opacity:.55; } 70% { opacity:0; } 100% { transform: scale(1.25); opacity:0; } }
    .wsh { animation: wobble 1.8s ease-in-out infinite; }
    @keyframes wobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  </style>
  <rect width="800" height="140" fill="none"/>
  <!-- pulsing halo behind bubble -->
  <circle class="ring" cx="98" cy="70" r="52" fill="#25D366" opacity="0.35"/>
  <circle class="ring ringB" cx="98" cy="70" r="52" fill="#25D366" opacity="0.35"/>
  <!-- pill -->
  <rect x="30" y="24" width="740" height="94" rx="47" fill="url(#wag)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- WhatsApp bubble -->
  <g class="wsh" style="transform-box: fill-box; transform-origin: center;">
    <circle cx="98" cy="70" r="33" fill="#FFFFFF"/>
    <path d="M112 92 l20 16 l-6 -21 z" fill="#FFFFFF"/>
    <path d="M84.2 56.6 c1.8 -1.6 4.6 -1.2 5.9 .8 l2.4 3.8 c1 1.7 .7 3.8 -.8 5.1 l-1.5 1.2 c1.8 3.7 4.7 6.6 8.4 8.4 l1.2 -1.5 c1.3 -1.5 3.4 -1.8 5.1 -.8 l3.8 2.4 c2 1.3 2.4 4.1 .8 5.9 l-1.8 2 c-1.7 1.9 -4.2 2.7 -6.6 2 C92.5 82.6 85.4 75.5 82 66.6 c-.7 -2.4 .1 -4.9 2 -6.6 z" fill="#128C7E"/>
  </g>
  <!-- text -->
  <text x="168" y="62" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1">CHAT JURAGAN SEKARANG</text>
  <text x="168" y="100" font-size="23" font-weight="bold" fill="#EAFBF0">+62 813-8768-5252  •  Online 08.00–21.00 WIB</text>
</svg>
