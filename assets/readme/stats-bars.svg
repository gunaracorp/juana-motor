<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" width="1600" height="430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C93E0F"/>
      <stop offset="0.55" stop-color="#F4581C"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.6" stop-color="#E8B44A"/>
      <stop offset="1" stop-color="#F5D06F"/>
    </linearGradient>
    <pattern id="stripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#FFFFFF" opacity="0.14"/>
    </pattern>
  </defs>
  <style>
    .chipDot { animation: dotPulse 1.5s ease-in-out infinite; }
    @keyframes dotPulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    .stripeMove { animation: stmove 1.1s linear infinite; }
    @keyframes stmove { to { transform: translateX(-18px); } }
  </style>

  <rect width="1600" height="430" fill="#0F0F17"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#rg)"/>

  <text x="800" y="52" text-anchor="middle" font-size="24" font-weight="bold" letter-spacing="6" fill="#E8B44A">DATA LANGSUNG DARI DATABASE KATALOG — NOVEMBER 2026</text>

  <!-- BAR 1 : MOTOR BARU -->
  <text x="90" y="118" font-size="27" font-weight="900" fill="#FFFFFF">MOTOR BARU</text>
  <text x="1510" y="118" text-anchor="end" font-size="30" font-weight="900" fill="#FF7A2F">170 UNIT</text>
  <rect x="90" y="134" width="1160" height="44" rx="22" fill="#1C1C29" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g>
    <animate attributeName="width" from="0" to="944" dur="1.6s" fill="freeze"/>
    <rect x="90" y="134" width="944" height="44" rx="22" fill="url(#rg)"/>
  </g>
  <g class="stripeMove" clip-path="url(#clipB1)">
    <rect x="90" y="134" width="1920" height="44" fill="url(#stripes)"/>
  </g>
  <clipPath id="clipB1"><rect x="90" y="134" width="944" height="44" rx="22"/></clipPath>
  <text x="90" y="204" font-size="19" fill="#8B8BA0">Rentang harga  Rp 4,49 jt — Rp 439,9 jt  •  22 merek  •  garansi showroom</text>

  <!-- BAR 2 : MOTOR BEKAS -->
  <text x="90" y="256" font-size="27" font-weight="900" fill="#FFFFFF">MOTOR BEKAS PILIHAN</text>
  <text x="1510" y="256" text-anchor="end" font-size="30" font-weight="900" fill="#E8B44A">209 UNIT</text>
  <rect x="90" y="272" width="1160" height="44" rx="22" fill="#1C1C29" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g>
    <animate attributeName="width" from="0" to="1160" dur="1.6s" fill="freeze"/>
    <rect x="90" y="272" width="1160" height="44" rx="22" fill="url(#goldg)"/>
  </g>
  <g class="stripeMove" clip-path="url(#clipB2)">
    <rect x="90" y="272" width="1920" height="44" fill="url(#stripes)"/>
  </g>
  <clipPath id="clipB2"><rect x="90" y="272" width="1160" height="44" rx="22"/></clipPath>
  <text x="90" y="342" font-size="19" fill="#8B8BA0">Rentang harga  Rp 6,62 jt — Rp 105,5 jt  •  sudah diinspeksi juragan  •  bisa kredit</text>

  <!-- chips -->
  <g font-size="21" font-weight="bold">
    <rect x="48"  y="366" width="352" height="52" rx="26" fill="#16161F" stroke="#F4581C" stroke-opacity="0.45"/>
    <circle class="chipDot" cx="86" cy="392" r="8" fill="#F4581C"/>
    <text x="112" y="399" fill="#EDEDF5">22 MEREK LENGKAP</text>

    <rect x="432" y="366" width="352" height="52" rx="26" fill="#16161F" stroke="#E8B44A" stroke-opacity="0.45"/>
    <circle class="chipDot" cx="470" cy="392" r="8" fill="#E8B44A"/>
    <text x="496" y="399" fill="#EDEDF5">9 KATEGORI MOTOR</text>

    <rect x="816" y="366" width="352" height="52" rx="26" fill="#16161F" stroke="#F4581C" stroke-opacity="0.45"/>
    <circle class="chipDot" cx="854" cy="392" r="8" fill="#F4581C"/>
    <text x="880" y="399" fill="#EDEDF5">102 FOTO PRODUK</text>

    <rect x="1200" y="366" width="352" height="52" rx="26" fill="#16161F" stroke="#E8B44A" stroke-opacity="0.45"/>
    <circle class="chipDot" cx="1238" cy="392" r="8" fill="#E8B44A"/>
    <text x="1264" y="399" fill="#EDEDF5">7 PARTNER LEASING</text>
  </g>
</svg>
