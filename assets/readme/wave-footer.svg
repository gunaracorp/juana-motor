<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 160" width="1600" height="160" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="rgw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C93E0F"/>
      <stop offset="0.5" stop-color="#F4581C"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
    <linearGradient id="goldw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#F5D06F"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: wave 11s linear infinite; }
    .w2 { animation: wave 16s linear infinite reverse; }
    .w3 { animation: wave 22s linear infinite; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-1600px); } }
  </style>
  <rect width="1600" height="160" fill="#0A0A11"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#rgw)"/>

  <!-- gold wave (faint, back) -->
  <g class="w1" opacity="0.16">
    <path d="M0 46 Q200 6 400 46 T800 46 T1200 46 T1600 46 T2000 46 T2400 46 T2800 46 T3200 46 L3200 160 L0 160 Z" fill="url(#goldw)"/>
  </g>
  <!-- orange wave (middle) -->
  <g class="w2" opacity="0.5">
    <path d="M0 84 Q200 44 400 84 T800 84 T1200 84 T1600 84 T2000 84 T2400 84 T2800 84 T3200 84 L3200 160 L0 160 Z" fill="url(#rgw)"/>
  </g>
  <!-- dark wave (front) -->
  <g class="w3">
    <path d="M0 116 Q200 82 400 116 T800 116 T1200 116 T1600 116 T2000 116 T2400 116 T2800 116 T3200 116 L3200 160 L0 160 Z" fill="#12121B"/>
  </g>
</svg>
