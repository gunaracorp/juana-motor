<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A2F"/>
      <stop offset="1" stop-color="#C93E0F"/>
    </linearGradient>
  </defs>
  <!-- tire -->
  <circle cx="70" cy="70" r="62" fill="#0D0D14" stroke="#26262F" stroke-width="14"/>
  <circle cx="70" cy="70" r="62" fill="none" stroke="#34343F" stroke-width="3" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- rim -->
  <circle cx="70" cy="70" r="42" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <circle cx="70" cy="70" r="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- brake caliper (static) -->
  <rect x="100" y="56" width="13" height="28" rx="6" fill="#E8B44A"/>
  <!-- spokes (rotating) -->
  <g transform="translate(70,70)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4.5s" repeatCount="indefinite"/>
      <g stroke="url(#rim)" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="0" x2="0"     y2="-38"/>
        <line x1="0" y1="0" x2="36.1"  y2="-11.7"/>
        <line x1="0" y1="0" x2="22.3"  y2="30.7"/>
        <line x1="0" y1="0" x2="-22.3" y2="30.7"/>
        <line x1="0" y1="0" x2="-36.1" y2="-11.7"/>
      </g>
    </g>
    <!-- hub -->
    <circle r="15" fill="#E8B44A" stroke="#B8860B" stroke-width="2.5"/>
    <circle r="5"  fill="#7A5A10"/>
  </g>
</svg>
